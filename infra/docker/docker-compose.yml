version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: udp-minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Console Port
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Le service "createbuckets" permet de créer automatiquement les buckets "raw" au démarrage
  createbuckets:
    image: minio/mc:latest
    container_name: udp-minio-mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb myminio/raw-web-html || true;
      /usr/bin/mc mb myminio/raw-documents || true;
      /usr/bin/mc mb myminio/raw-images || true;
      /usr/bin/mc mb myminio/raw-json || true;
      /usr/bin/mc mb myminio/raw-logs || true;
      /usr/bin/mc anonymous set public myminio/raw-web-html || true;
      /usr/bin/mc anonymous set public myminio/raw-documents || true;
      /usr/bin/mc anonymous set public myminio/raw-images || true;
      /usr/bin/mc anonymous set public myminio/raw-json || true;
      /usr/bin/mc anonymous set public myminio/raw-logs || true;
      exit 0;
      "

volumes:
  minio_data: